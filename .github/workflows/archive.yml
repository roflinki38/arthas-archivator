name: archive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: archive
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # ветка status
      issues: write     # уведомления о сбоях
      actions: write    # keepalive расписания
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Init
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          # GitHub отключает cron в репозитории без активности 60 дней; повторное включение сбрасывает таймер
          wid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) \
            && gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wid/enable" \
            || echo "WARN: keepalive не сработал"

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -n 1

      - name: Install
        run: |
          pip install -U "yt-dlp[default]" internetarchive
          yt-dlp --version
          deno --version
          ffmpeg -version | head -n 1

      - name: IA config
        env:
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
        run: |
          : "${IA_ACCESS:?секрет IA_ACCESS не задан}"
          : "${IA_SECRET:?секрет IA_SECRET не задан}"
          mkdir -p ~/.config/internetarchive
          ( umask 077; printf "[s3]\naccess = %s\nsecret = %s\n" "$IA_ACCESS" "$IA_SECRET" > ~/.config/internetarchive/ia.ini )

      # --- состояние между запусками лежит в ветке status: skip.txt и verified.txt ---
      - name: Load state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          load() {
            code=$(curl -sS --retry 3 -o "$1" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/status/$1" || echo 000)
            case "$code" in
              200) ;;
              404) : > "$1" ;;   # первый запуск, файла ещё нет
              *) echo "::error::Не удалось загрузить $1 (HTTP $code), чтобы не затереть состояние, запуск остановлен"; exit 1 ;;
            esac
          }
          load skip.txt
          load verified.txt
          echo "skip.txt: $(wc -l < skip.txt) строк, verified.txt: $(wc -l < verified.txt) строк"

      # --- автоаудит: находит старые видео ниже 1080p и помечает их на перезаливку ---
      - name: Audit quality
        shell: bash
        continue-on-error: true
        env:
          TAG: papich-yt-archive
          IA_EMAIL: ${{ secrets.IA_EMAIL }}
        run: |
          MIN_H=1080; TTL=2592000; NOW=$(date +%s)
          [ -n "${IA_EMAIL:-}" ] || { echo "IA_EMAIL не задан"; exit 1; }

          # только айтемы arthas-*: youtube-* не трогаем, чтобы не плодить дубли
          ia search "uploader:$IA_EMAIL" --itemlist | { grep -E '^arthas-[a-z]+-' || true; } | sort -u \
            | sed -E 's/^(arthas-[a-z]+-)(.*)$/\1\2\t\2/' > a_items.tsv

          # не проверяем повторно: видео >= 1080p (навсегда), остальные записи (30 дней), активные пропуски
          sort -k1,1 -k3,3nr verified.txt | awk '!s[$1]++' \
            | awk -v m=$MIN_H -v lim=$((NOW-TTL)) '$2>=m || $3>lim {print $1}' > a_valid.txt
          awk -v lim=$((NOW-TTL)) '$2>lim{print $1}' skip.txt > a_skip.txt
          cat a_valid.txt a_skip.txt | sort -u > a_excl.txt
          awk -F'\t' 'FILENAME==ARGV[1]{d[$1]=1;next} !($2 in d){print $1}' a_excl.txt a_items.tsv > a_todo.txt
          echo "Айтемов: $(wc -l < a_items.tsv), к проверке: $(wc -l < a_todo.txt)"
          [ -s a_todo.txt ] || exit 0

          check() {
            local i="$1" h
            h=$(ia metadata "$i" | jq -r '[ .files[]? | select(.source=="original") | select(.name|test("\\.(mp4|mkv|webm|mov)$";"i")) | (.height // empty | tonumber) ] | (max // -1)') || h=ERR
            printf '%s %s\n' "$i" "$h"
          }
          export -f check
          timeout 2400 xargs -P 4 -I{} bash -c 'check {}' < a_todo.txt > a_heights.txt || true

          low=0; unk=0; good=0; err=0
          while read -r item h <&3; do
            id="${item#arthas-*-}"
            case "$h" in
              ERR) err=$((err+1)) ;;
              -1)  echo "$id -1 $NOW" >> verified.txt; unk=$((unk+1)) ;;
              *)
                if [ "$h" -ge "$MIN_H" ]; then
                  echo "$id $h $NOW" >> verified.txt; good=$((good+1))
                elif ia metadata "$item" --modify="subject:$TAG-incomplete" </dev/null >/dev/null; then
                  echo "$id $h $NOW" >> verified.txt; low=$((low+1))
                  echo "На перезаливку: $item (${h}p)"
                else
                  echo "WARN: не удалось пометить $item"
                fi
                sleep 1 ;;
            esac
          done 3< a_heights.txt
          echo "Аудит: >=${MIN_H}p: $good, помечено на перезаливку: $low, высота неизвестна: $unk, ошибок: $err"

      # --- Фильтр yt-dlp: пропускаем идущие трансляции и стримы свежее 2 дней ---
      - name: Configure yt-dlp filter
        shell: bash
        run: |
          CUTOFF=$(($(date +%s) - 172800))
          mkdir -p ~/.config/yt-dlp
          cat << EOF > ~/.config/yt-dlp/config
          --ignore-no-formats
          --match-filter "!was_live & !is_live & live_status!=post_live & live_status!=is_upcoming"
          --match-filter "live_status=was_live & release_timestamp <= $CUTOFF"
          --match-filter "live_status=was_live & !release_timestamp & timestamp <= $CUTOFF"
          EOF
          echo "Конфигурация yt-dlp создана. Стримы позднее $CUTOFF будут игнорироваться."

      - name: Archive
        shell: bash
        env:
          CHANNEL: "@SpitefulDick"
          TAG: papich-yt-archive
          CREATOR: "Arthas (Папич)"
          IA_EMAIL: ${{ secrets.IA_EMAIL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: bash scripts/archive.sh

      - name: Cleanup
        if: always()
        run: |
          rm -f cookies.txt
          rm -f ~/.config/yt-dlp/config

      # --- сообщения о сбоях: issue в этом репозитории (GitHub пришлёт письмо) ---
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --search 'Архиватор остановился in:title' --json number --jq '.[0].number // empty' || true)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Снова остановился: $url"
          else
            gh issue create --title "Архиватор остановился" --body "Запуск завершился с ошибкой: $url

          Чаще всего причина в протухших куках YouTube: обновите секрет YT_COOKIES_B64. Если в логе другая ошибка, смотрите её там. Это сообщение закроется само после первого успешного запуска."
          fi

      - name: Close failure issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for n in $(gh issue list --state open --search 'Архиватор остановился in:title' --json number --jq '.[].number' || true); do
            gh issue close "$n" --comment "Запуск прошёл успешно: $url" || true
          done
