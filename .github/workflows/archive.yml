name: archive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency: archive

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }

      - name: Install
        run: |
          pip install -U "yt-dlp[default]" internetarchive bgutil-ytdlp-pot-provider
          yt-dlp --version
          deno --version
          ffmpeg -version | head -n 1

      # --- PO token: локальный сервис, который генерирует токены для плагина ---
      - name: Start PO token provider
        run: |
          docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do
            if curl -s -o /dev/null --max-time 20 -X POST \
                 -H 'Content-Type: application/json' -d '{}' \
                 http://127.0.0.1:4416/get_pot; then
              echo "PO token provider готов"
              break
            fi
            sleep 2
          done
          docker logs bgutil-provider | tail -n 5

      - name: IA config
        env:
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
        run: |
          mkdir -p ~/.config/internetarchive
          printf "[s3]\naccess = %s\nsecret = %s\n" "$IA_ACCESS" "$IA_SECRET" > ~/.config/internetarchive/ia.ini

      - name: Archive
        shell: bash
        env:
          CHANNEL: "@SpitefulDick"            # <-- подставь хэндл канала, с @
          TAG: papich-yt-archive
          CREATOR: "Arthas (Папич)"
          IA_EMAIL: ${{ secrets.IA_EMAIL }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}   # необязательно
        run: |
          # ---------- 0. cookies (только если задан секрет YT_COOKIES_B64) ----------
          COOKIE_ARGS=()
          if [ -n "${YT_COOKIES_B64:-}" ]; then
            echo "$YT_COOKIES_B64" | base64 -d > cookies.txt
            COOKIE_ARGS=(--cookies cookies.txt)
            echo "Cookies подключены"
          fi

          # клиенты YouTube, которые просят PO token (чтобы плагин реально сработал)
          YT_ARGS=(--extractor-args "youtube:player-client=mweb,tv,web_safari")

          # ---------- 1. все стримы и видео канала ----------
          : > ids_raw.txt
          yt-dlp "${COOKIE_ARGS[@]}" --flat-playlist --print id "https://www.youtube.com/$CHANNEL/streams" \
            | sed 's/^/stream /' >> ids_raw.txt || true
          yt-dlp "${COOKIE_ARGS[@]}" --flat-playlist --print id "https://www.youtube.com/$CHANNEL/videos" \
            | sed 's/^/video /' >> ids_raw.txt || true

          # убираем дубли по ID (если видео в обеих вкладках, считаем стримом)
          awk '!seen[$2]++' ids_raw.txt > ids.txt
          [ -s ids.txt ] || { echo "::error::Список пуст, вероятно блокировка или неверный CHANNEL"; exit 1; }

          # ---------- 2. что уже загружено ----------
          # старые айтемы arthas-* из твоего аккаунта + новые с тегом успешной загрузки
          {
            ia search "uploader:$IA_EMAIL" --itemlist | grep -E '^arthas-[a-z]+-' || true
            ia search "uploader:$IA_EMAIL AND subject:$TAG" --itemlist
          } | sed -E 's/^(youtube|arthas-[a-z]+)-//' | sort -u > done.txt

          # ---------- 3. очередь = разница ----------
          awk 'FILENAME==ARGV[1]{d[$1]=1; next} !($2 in d)' done.txt ids.txt > todo.txt
          echo "Всего на канале: $(wc -l < ids.txt)"
          echo "Уже в архиве:    $(wc -l < done.txt)"
          echo "К загрузке:      $(wc -l < todo.txt)"

          # ---------- 3.5. диагностика: работает ли PO token ----------
          first=$(awk 'NR==1{print $2}' todo.txt)
          if [ -n "$first" ]; then
            echo "--- проверка PO token на $first ---"
            yt-dlp -v --skip-download "${COOKIE_ARGS[@]}" "${YT_ARGS[@]}" "https://youtu.be/$first" 2>&1 \
              | grep -E "PO Token|bgutil" | head -n 10 || true
            echo "--- конец проверки ---"
          fi

          # ---------- 4. скачиваем и заливаем ----------
          end=$((SECONDS+19000))   # ~5 часов 17 минут, до лимита в 6 часов
          bot_fails=0
          : > ok.txt

          while read -r kind id; do
            if [ "$SECONDS" -gt "$end" ]; then
              echo "Лимит времени, продолжим в следующем запуске"
              break
            fi

            item="arthas-$kind-$id"
            echo "=== $item ==="
            rm -rf dl; mkdir dl

            if ! yt-dlp "${COOKIE_ARGS[@]}" "${YT_ARGS[@]}" \
                 -f "bv*+ba/b" -S "res:720,ext:mp4:m4a" --merge-output-format mp4 \
                 --max-filesize 8G \
                 --sleep-requests 1 --sleep-interval 5 --max-sleep-interval 15 --retries 5 \
                 --write-info-json --write-thumbnail \
                 -o "dl/$id.%(ext)s" "https://youtu.be/$id" 2>&1 | tee dl.log; then
              echo "FAIL download $id"
              if grep -qi "confirm your age" dl.log; then
                echo "AGE-RESTRICTED $id: нужны cookies, пропускаю"
              elif grep -qi "not a bot" dl.log; then
                bot_fails=$((bot_fails+1))
                if [ "$bot_fails" -ge 3 ]; then
                  echo "::error::YouTube блокирует запросы (бот-проверка), останавливаюсь. Если PO token не помог, нужны cookies (секрет YT_COOKIES_B64)"
                  exit 1
                fi
              fi
              continue
            fi
            bot_fails=0

            title=$(jq -r '.title // empty' "dl/$id.info.json")
            [ -n "$title" ] || title="$id"
            date=$(jq -r '.upload_date // empty' "dl/$id.info.json" \
                   | sed -E 's/^([0-9]{4})([0-9]{2})([0-9]{2})$/\1-\2-\3/')

            if ia upload "$item" dl/"$id".* \
                 --metadata="mediatype:movies" \
                 --metadata="title:$title" \
                 --metadata="creator:$CREATOR" \
                 --metadata="date:$date" \
                 --metadata="source:https://youtu.be/$id" \
                 --retries 5; then
              ia metadata "$item" --modify="subject:$TAG" || echo "WARN: тег не поставлен для $item"
              echo "OK $item"
              echo "$id" >> ok.txt
            else
              echo "FAIL upload $item"
            fi

            rm -rf dl
          done < todo.txt

      - name: Provider logs
        if: always()
        run: docker logs bgutil-provider 2>&1 | tail -n 30

      # --- статус для страницы: сколько всего и сколько уже в архиве ---
      - name: Build status
        if: always()
        run: |
          [ -s ids.txt ] && [ -f done.txt ] || { echo "нет данных для статуса"; exit 0; }
          touch ok.txt
          cat done.txt ok.txt | sort -u > all_done.txt
          read -r st_t st_d vd_t vd_d < <(awk 'FILENAME==ARGV[1]{d[$1]=1;next} {t[$1]++; if($2 in d) a[$1]++} END{print t["stream"]+0, a["stream"]+0, t["video"]+0, a["video"]+0}' all_done.txt ids.txt)
          mkdir -p site
          jq -n --arg u "$(date -u +%FT%TZ)" \
            --argjson a "$st_t" --argjson b "$st_d" --argjson c "$vd_t" --argjson d "$vd_d" \
            '{updated:$u, streams:{total:$a, archived:$b}, videos:{total:$c, archived:$d}}' > site/status.json
          cat site/status.json

      - uses: actions/upload-pages-artifact@v3
        if: always() && hashFiles('site/status.json') != ''
        with: { path: site }

      - uses: actions/deploy-pages@v4
        if: always() && hashFiles('site/status.json') != ''
