name: archive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: archive
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # ветка status
      issues: write     # уведомления о сбоях
      actions: write    # keepalive расписания
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Init
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          wid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) \
            && gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wid/enable" \
            || echo "WARN: keepalive не сработал"

      # --- Максимальная очистка диска: освобождает ~60-65 ГБ ---
      - name: Maximize disk space
        run: |
          echo "=== До очистки ==="
          df -h /
          # 1. Удаление тяжелых неиспользуемых сред (~35-40 ГБ)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          # 2. Удаление ненужных инструментов из toolcache (~8 ГБ)
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Java* /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go
          # 3. Удаление предустановленных Docker-образов (~15 ГБ)
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          # 4. Отключение и удаление swap (~4 ГБ)
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile 2>/dev/null || true
          echo "=== После очистки ==="
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Кэширование пакетов pip (недельная ротация) ---
      - name: Set cache key
        id: cache-key
        run: echo "week=$(date +'%Y-%U')" >> "$GITHUB_OUTPUT"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ steps.cache-key.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --- ffmpeg нужен yt-dlp для склейки видео и аудио ---
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: |
          pip install --prefer-binary -U "yt-dlp[default]" internetarchive
          yt-dlp --version
          deno --version
          command -v ffmpeg >/dev/null || { echo "::error::ffmpeg не установлен"; exit 1; }
          ffmpeg -version | head -n 1

      - name: IA config
        env:
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
        run: |
          : "${IA_ACCESS:?секрет IA_ACCESS не задан}"
          : "${IA_SECRET:?секрет IA_SECRET не задан}"
          mkdir -p ~/.config/internetarchive
          ( umask 077; printf "[s3]\naccess = %s\nsecret = %s\n" "$IA_ACCESS" "$IA_SECRET" > ~/.config/internetarchive/ia.ini )

      - name: YouTube cookies
        shell: bash
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          : "${YT_COOKIES_B64:?секрет YT_COOKIES_B64 не задан}"
          echo "$YT_COOKIES_B64" | base64 -d > cookies.txt
          chmod 600 cookies.txt

      # --- состояние между запусками лежит в ветке status: skip.txt и verified.txt ---
      - name: Load state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          load() {
            code=$(curl -sS --retry 3 -o "$1" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/status/$1" || echo 000)
            case "$code" in
              200) ;;
              404) : > "$1" ;;
              *) echo "::error::Не удалось загрузить $1 (HTTP $code), запуск остановлен"; exit 1 ;;
            esac
          }
          load skip.txt
          load verified.txt
          code=$(curl -sS --retry 3 -o prev.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/status/status.json" || echo 000)
          case "$code" in
            200) ;;
            404) echo '{}' > prev.json ;;
            *) echo "::warning::prev status недоступен (HTTP $code)"; echo '{}' > prev.json ;;
          esac
          echo "skip.txt: $(wc -l < skip.txt) строк, verified.txt: $(wc -l < verified.txt) строк"

      # --- автоаудит качества: находит видео ниже 1080p и помечает на перезаливку, только если на YT появилось лучшее качество ---
      - name: Audit quality
        shell: bash
        continue-on-error: true
        env:
          TAG: papich-yt-archive
          IA_EMAIL: ${{ secrets.IA_EMAIL }}
        run: |
          MIN_H=1080; TTL=2592000; NOW=$(date +%s)
          [ -n "${IA_EMAIL:-}" ] || { echo "IA_EMAIL не задан"; exit 1; }

          ia search "uploader:$IA_EMAIL" --itemlist | { grep -E '^arthas-' || true; } | sort -u > a_items.txt

          sort -k1,1 -k3,3nr verified.txt | awk '!s[$1]++' \
            | awk -v m=$MIN_H -v lim=$((NOW-TTL)) '$2>=m || $3>lim {print $1}' > a_valid.txt
          awk -v lim=$((NOW-TTL)) '$2>lim{print $1}' skip.txt > a_skip.txt
          cat a_valid.txt a_skip.txt | sort -u > a_excl.txt

          awk 'FILENAME==ARGV[1]{d[$1]=1;next} {
            i=$1; sub(/^arthas-archive-/,"",i); sub(/^arthas-/,"",i); sub(/^stream-/,"",i); sub(/^video-/,"",i)
            if (!(i in d)) print $1
          }' a_excl.txt a_items.txt > a_todo.txt
          echo "Айтемов: $(wc -l < a_items.txt), к проверке: $(wc -l < a_todo.txt)"
          [ -s a_todo.txt ] || exit 0

          check() {
            local i="$1" h
            h=$(ia metadata "$i" | jq -r '[ .files[]? | select(.source=="original") | select(.name|test("\\.(mp4|mkv|webm|mov)$";"i")) | (.height // empty | tonumber) ] | (max // -1)') || h=ERR
            printf '%s %s\n' "$i" "$h"
          }
          export -f check
          timeout 2400 xargs -P 4 -n 1 bash -c 'check "$1"' _ < a_todo.txt > a_heights.txt || true

          low=0; unk=0; good=0; err=0
          while read -r item h <&3; do
            id="${item#arthas-archive-}"; id="${id#arthas-}"; id="${id#stream-}"; id="${id#video-}"
            case "$h" in
              ERR) err=$((err+1)) ;;
              -1)  echo "$id -1 $NOW" >> verified.txt; unk=$((unk+1)) ;;
              *)
                if [ "$h" -ge "$MIN_H" ]; then
                  echo "$id $h $NOW" >> verified.txt; good=$((good+1))
                else
                  yt_max=$(yt-dlp --cookies cookies.txt --no-match-filter --print "%(height)s" -f "bv/b" "https://youtu.be/$id" 2>/dev/null | sort -n | tail -n1 || echo 0)
                  if [ -n "$yt_max" ] && [ "$yt_max" -gt "$h" ]; then
                    if ia metadata "$item" --modify="subject:$TAG-incomplete" </dev/null >/dev/null; then
                      echo "$id $h $NOW" >> verified.txt; low=$((low+1))
                      echo "На перезаливку: $item (${h}p -> доступно ${yt_max}p)"
                    fi
                  else
                    echo "$id $MIN_H $NOW" >> verified.txt; good=$((good+1))
                    echo "Оставляем как есть: $item (на YouTube максимум ${yt_max:-$h}p)"
                  fi
                fi
                sleep 1 ;;
            esac
          done 3< a_heights.txt
          echo "Аудит: >=${MIN_H}p или максимум: $good, на перезаливку: $low, неизвестно: $unk, ошибок: $err"

      # --- Фильтр yt-dlp: валидный синтаксис (несколько --match-filter работают как OR) ---
      - name: Configure yt-dlp filter
        shell: bash
        run: |
          CUTOFF=$(($(date +%s) - 172800))
          mkdir -p ~/.config/yt-dlp
          cat << EOF > ~/.config/yt-dlp/config
          --ignore-no-formats
          --match-filter "!was_live & !is_live & live_status!=post_live & live_status!=is_upcoming"
          --match-filter "live_status=was_live & release_timestamp <= $CUTOFF"
          --match-filter "live_status=was_live & !release_timestamp & timestamp <= $CUTOFF"
          EOF
          echo "Конфигурация yt-dlp создана. Стримы позднее $CUTOFF будут игнорироваться."

      - name: Archive
        shell: bash
        env:
          CHANNEL: "@SpitefulDick"
          TAG: papich-yt-archive
          CREATOR: "Arthas (Папич)"
          IA_EMAIL: ${{ secrets.IA_EMAIL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          sed -i 's/\r$//' scripts/archive.sh
          bash scripts/archive.sh

      - name: Cleanup
        if: always()
        run: |
          rm -f cookies.txt
          rm -f ~/.config/yt-dlp/config

      # --- сообщения о сбоях: issue в этом репозитории ---
      - name: Report failure
        if: failure() || cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --search 'Архиватор остановился in:title' --json number --jq '.[0].number // empty' || true)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Снова остановился или был отменён: $url"
          else
            gh issue create --title "Архиватор остановился" --body "Запуск не дошёл до конца: $url

          Что проверить по порядку:
          1. Сообщение с префиксом ::error:: в логе шага Archive (или Audit quality).
          2. Протухшие куки YouTube: обновите секрет YT_COOKIES_B64.
          3. Секреты IA_EMAIL / IA_ACCESS / IA_SECRET.

          Сообщение закроется само после первого успешного запуска."
          fi

      - name: Close failure issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for n in $(gh issue list --state open --search 'Архиватор остановился in:title' --json number --jq '.[].number' || true); do
            gh issue close "$n" --comment "Запуск прошёл успешно: $url" || true
          done
